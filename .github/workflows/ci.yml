name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run api:build
      - run: npm run dotnet -- tool restore
      - run: npm run dotnet -- ef migrations has-pending-model-changes --project backend/Nova.Api
      - run: npm run test:api
